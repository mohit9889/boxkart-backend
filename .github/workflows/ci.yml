name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: box_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Database Migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/box_engine_test?schema=public
        
    - name: Seed Database
      run: npm run seed
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/box_engine_test?schema=public
      
    - name: Validate OpenAPI spec
      run: npm run openapi:validate
      
    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test
        JWT_SECRET: test_secret
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/box_engine_test?schema=public
        SUPABASE_URL: https://mock.supabase.co
        SUPABASE_SERVICE_KEY: mock-service-key-for-ci

    - name: Security Audit
      run: npm audit --audit-level=high
