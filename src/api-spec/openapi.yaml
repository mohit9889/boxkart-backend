openapi: 3.1.0
info:
  title: BoxKart Box Engine API
  version: 1.0.0
  description: API documentation for BoxKart Box Engine
servers:
  - url: /api/v1
    description: Box Engine API
paths:
  /auth/csrf-token:
    get:
      tags:
        - Authentication
      summary: Get CSRF token
      description: Returns a CSRF token to be included in the X-CSRF-Token header of state-mutating requests. Also sets an HttpOnly cookie with the token.
      responses:
        '200':
          description: CSRF token successfully generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      csrfToken:
                        type: string
                        example: "a1b2c3d4e5f6..."

  /auth/signup:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        '201':
          description: User created successfully

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
        '400':
          description: Validation error or email already in use

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
  /auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly cookie containing the auth token
        '401':
          description: Invalid credentials

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
  /auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      responses:
        '200':
          description: Logged out successfully

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: The response payload
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /auth/me:
    get:
      summary: Get current user profile
      tags:
        - Authentication
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User profile

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
        '401':
          description: Unauthorized

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
  /categories:
    get:
      summary: List all active categories
      tags:
        - Catalog
      responses:
        '200':
          description: A list of categories

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /categories/{slug}:
    get:
      summary: Get category by slug
      tags:
        - Catalog
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Category'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
        '404':
          description: Category not found

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
  /products:
    get:
      summary: List products with pagination and filters
      tags:
        - Catalog
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A list of products

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /products/{slug}:
    get:
      summary: Get product details by slug
      tags:
        - Catalog
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
        '404':
          description: Product not found

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
  /box-finder/recommend:
    post:
      summary: Recommend boxes for a product
      tags:
        - Box Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product
              properties:
                product:
                  type: object
                  required:
                    - length
                    - width
                    - height
                    - unit
                  properties:
                    length:
                      type: number
                    width:
                      type: number
                    height:
                      type: number
                    unit:
                      type: string
                      enum: [INCH, CM, MM]
                    weight:
                      type: number
                    weightUnit:
                      type: string
                      enum: [KG, GRAM, LB, OZ]
                requirements:
                  type: object
                  properties:
                    quantity:
                      type: integer
                      default: 1
                preferences:
                  type: object
                  properties:
                    priority:
                      type: string
                      enum: [LOWEST_PRICE, BEST_FIT, BEST_PROTECTION, BALANCED]
      responses:
        '200':
          description: A ranked list of recommended boxes

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BoxRecommendationResponse'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /pricing/calculate:
    post:
      summary: Calculate exact price for a product
      tags:
        - Pricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
      responses:
        '200':
          description: Price calculation successful

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PricingResponse'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
        '400':
          description: Validation error or below MOQ

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
  /cart:
    get:
      summary: Get the current user's cart
      tags:
        - Cart
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Cart retrieved

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Cart'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
    delete:
      summary: Clear the cart
      tags:
        - Cart
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Cart cleared

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: The response payload
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /cart/items:
    post:
      summary: Add an item to the cart
      tags:
        - Cart
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
      responses:
        '200':
          description: Item added

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Cart'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /cart/items/{itemId}:
    patch:
      summary: Update item quantity
      tags:
        - Cart
      security:
        - cookieAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: Quantity updated

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Cart'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
    delete:
      summary: Remove an item from the cart
      tags:
        - Cart
      security:
        - cookieAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: The response payload
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /checkout/preview:
    post:
      summary: Preview checkout calculation statelessly
      tags:
        - Checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
      responses:
        '200':
          description: Checkout preview details

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CheckoutPreview'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /orders:
    post:
      summary: Place a new order from cart
      tags:
        - Orders
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Order created and cart emptied

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Order'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
        '400':
          description: Cart is empty or below MOQ

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
    get:
      summary: List all user orders
      tags:
        - Orders
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of orders retrieved

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: The response payload
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
  /orders/{orderId}:
    get:
      summary: Get details of a specific order
      tags:
        - Orders
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details retrieved

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Order'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
        '404':
          description: Order not found

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
  /orders/{orderId}/status:
    patch:
      summary: Update order status
      tags:
        - Orders
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, PROCESSING, READY_TO_SHIP, SHIPPED, DELIVERED, CANCELLED, FAILED]
      responses:
        '200':
          description: Order status updated

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Order'
                  meta:
                    type: object
                    description: Optional metadata (e.g. pagination)
        '400':
          description: Illegal state transition

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
        '404':
          description: Order not found

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        shortDescription:
          type: string
        productType:
          type: string
        unit:
          type: string
        moq:
          type: integer
        weight:
          type: number
        weightUnit:
          type: string
        priceTiers:
          type: array
          items:
            $ref: '#/components/schemas/ProductPriceTier'
    ProductPriceTier:
      type: object
      properties:
        minimumQuantity:
          type: integer
        maximumQuantity:
          type: integer
        unitPriceMinor:
          type: integer
        currency:
          type: string
    BoxRecommendationResponse:
      type: object
      properties:
        score:
          type: number
        recommendation:
          type: object
          properties:
            productId:
              type: string
            boxSku:
              type: string
            name:
              type: string
            internalLength:
              type: number
            internalWidth:
              type: number
            internalHeight:
              type: number
            dimensionUnit:
              type: string
            maxRecommendedWeight:
              type: number
            weightUnit:
              type: string
        pricing:
          $ref: '#/components/schemas/PricingResponse'
    PricingResponse:
      type: object
      properties:
        quantity:
          type: integer
        unitPriceMinor:
          type: integer
        totalPriceMinor:
          type: integer
        currency:
          type: string
        tierApplied:
          type: object
          properties:
            minimumQuantity:
              type: integer
            maximumQuantity:
              type: integer
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
        product:
          $ref: '#/components/schemas/Product'
    CheckoutPreview:
      type: object
      properties:
        subtotalMinor:
          type: integer
        shippingMinor:
          type: integer
        taxMinor:
          type: integer
        totalMinor:
          type: integer
        currency:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
        paymentStatus:
          type: string
        currency:
          type: string
        subtotalMinor:
          type: integer
        shippingMinor:
          type: integer
        taxMinor:
          type: integer
        totalMinor:
          type: integer
        shippingAddressSnapshot:
          type: object
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        skuSnapshot:
          type: string
        nameSnapshot:
          type: string
        quantity:
          type: integer
        unitPriceMinor:
          type: integer
        totalMinor:
          type: integer
