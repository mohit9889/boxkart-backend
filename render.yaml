services:
  - type: web
    name: box-engine
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run migrate:deploy
    startCommand: npm run start:prod
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Set this securely in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render will auto-generate a secure 256-bit string
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
